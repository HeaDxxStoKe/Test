# XcodeGen-Projektdefinition.
# Erzeugt aus den Quelldateien ein Xcode-Projekt (TrainingsApp.xcodeproj).
#
# Installation von XcodeGen (auf macOS):
#   brew install xcodegen
# Projekt generieren:
#   xcodegen generate
# Danach TrainingsApp.xcodeproj in Xcode öffnen.

name: TrainingsApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

targets:
  TrainingsApp:
    type: application
    platform: iOS
    sources:
      - path: TrainingsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TrainingsApp
        INFOPLIST_FILE: TrainingsApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrainingsApp/TrainingsApp.entitlements
        TARGETED_DEVICE_FAMILY: "1"   # nur iPhone
        SUPPORTS_MACCATALYST: NO
    # HealthKit als Systemframework
    dependencies:
      - sdk: HealthKit.framework
